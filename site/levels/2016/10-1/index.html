<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2016 Day 10 Part 1 | Journey of Advent of Code</title><style>body{margin:0;background:#f7f6fb;color:#292536;font:16px/1.55 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:2rem 1.25rem 4rem}a{color:#6f3eb0}textarea{width:100%;min-height:11rem;box-sizing:border-box;padding:.8rem;border:1px solid #d8d0e4;border-radius:.7rem;font:1rem ui-monospace,monospace}button{margin:.7rem .4rem 0 0;padding:.65rem 1rem;border:0;border-radius:999px;background:#6f3eb0;color:white;font-weight:700}.secondary{background:#e7def0;color:#39264d}.result{margin-top:1rem;padding:1rem;background:#eee8f5;border-radius:.7rem}.error{color:#a52a2a;min-height:1.5em}</style></head><body><main><p><a href="../../../index.html">← Journey map</a></p><p>2016 / Day 10 / Part 1</p><h1>Follow the ready bots</h1><p>Each bot wakes when it has two chips, then routes low and high values.</p><section><h2>Try the factory</h2><textarea id="input">value 5 goes to bot 2
bot 2 gives low to bot 1 and high to bot 0
value 3 goes to bot 1
bot 1 gives low to output 1 and high to bot 0
bot 0 gives low to output 2 and high to output 0
value 2 goes to bot 2</textarea><div><button id="run">Find comparator</button><button class="secondary" id="reset">Reset</button></div><p class="error" id="error" role="alert"></p><div class="result" id="result" aria-live="polite">Bot 2 compares 2 and 5.</div></section><h2>My answer</h2><p><strong>Bot 98</strong> compares 17 and 61.</p><h2>Journal</h2><p>A ready queue turns the network into a bounded event-driven simulation.</p></main><script>(()=>{const input=document.querySelector('#input'),result=document.querySelector('#result'),error=document.querySelector('#error'),initial=input.value;function find(s){const chips={},rules={};for(const line of s.trim().split(/\n/)){let m=line.match(/^value (\d+) goes to bot (\d+)$/);if(m)(chips[m[2]]??=[]).push(+m[1]);else if(m=line.match(/^bot (\d+) gives low to (bot|output) (\d+) and high to (bot|output) (\d+)$/))rules[m[1]]=[[m[2],+m[3]],[m[4],+m[5]]];else throw Error('Invalid instruction')}const q=Object.keys(chips).filter(k=>chips[k].length===2);while(q.length){const b=q.shift(),v=chips[b].sort((a,b)=>a-b);if(v[0]===2&&v[1]===5)return b;for(let i=0;i<2;i++){const[k,id]=rules[b][i];if(k==='bot'){(chips[id]??=[]).push(v[i]);if(chips[id].length===2)q.push(String(id))}}}throw Error('Comparator not found')}document.querySelector('#run').onclick=()=>{try{result.textContent='Bot '+find(input.value)+' compares 2 and 5.';error.textContent=''}catch(e){error.textContent=e.message}};document.querySelector('#reset').onclick=()=>{input.value=initial;result.textContent='Bot 2 compares 2 and 5.';error.textContent='' }})()</script></body></html>
