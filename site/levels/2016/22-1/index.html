<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2016 Day 22 Part 1 | Journey of Advent of Code</title><style>body{margin:0;background:#f7f6fb;color:#292536;font:16px/1.55 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:2rem 1.25rem 4rem}a{color:#6f3eb0}textarea{width:100%;box-sizing:border-box;min-height:13rem;padding:.65rem;border:1px solid #d8d0e4;border-radius:.6rem;font:1rem ui-monospace,monospace}button{margin:.8rem .4rem 0 0;padding:.65rem 1rem;border:0;border-radius:999px;background:#6f3eb0;color:#fff;font-weight:700}.secondary{background:#e7def0;color:#39264d}.result{margin-top:1rem;padding:1rem;background:#eee8f5;border-radius:.7rem;font-family:ui-monospace,monospace}.error{color:#9f2f50}</style></head><body><main><p><a href="../../../../index.html">← The route</a></p><h1>2016 Day 22 · Part 1</h1><p>Compare each nonempty node with every other node and count destinations with enough free space.</p><label for="nodes">Node table</label><textarea id="nodes">/dev/grid/node-x0-y0     10T    8T     2T   80%
/dev/grid/node-x0-y1     11T    6T     5T   54%
/dev/grid/node-x0-y2     32T   28T     4T   87%
/dev/grid/node-x1-y0      9T    7T     2T   77%
/dev/grid/node-x1-y1      8T    0T     8T    0%
/dev/grid/node-x1-y2     11T    7T     4T   63%
/dev/grid/node-x2-y0     10T    6T     4T   60%
/dev/grid/node-x2-y1      9T    8T     1T   88%
/dev/grid/node-x2-y2      9T    6T     3T   66%</textarea><button id="run" type="button">Run</button><button id="reset" class="secondary" type="button">Reset</button><div id="result" class="result" aria-live="polite">Enter node rows and count viable pairs.</div><h2>Concept</h2><p>The relationship is directional. Data from A must fit in B, while B does not need to fit in A.</p><script>const nodes=document.querySelector('#nodes'),result=document.querySelector('#result'),initial=nodes.value;function solve(text){const rows=[...text.matchAll(/\/dev\/grid\/node-x(\d+)-y(\d+)\s+(\d+)T\s+(\d+)T\s+(\d+)T/g)].map(m=>({used:Number(m[4]),avail:Number(m[5])}));if(!rows.length)throw Error('No node rows found.');let count=0;for(let i=0;i<rows.length;i++)for(let j=0;j<rows.length;j++)if(i!==j&&rows[i].used>0&&rows[i].used<=rows[j].avail)count++;return count}document.querySelector('#run').onclick=()=>{result.className='result';try{result.textContent='Viable pairs: '+solve(nodes.value)}catch(e){result.className='result error';result.textContent=e.message}};document.querySelector('#reset').onclick=()=>{nodes.value=initial;result.className='result';result.textContent='Enter node rows and count viable pairs.'};</script></main></body></html>
