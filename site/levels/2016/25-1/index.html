<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2016 Day 25 Part 1 | Journey of Advent of Code</title><style>body{margin:0;background:#f7f6fb;color:#292536;font:16px/1.55 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:2rem 1.25rem 4rem}a{color:#6f3eb0}textarea,input{width:100%;box-sizing:border-box;padding:.65rem;border:1px solid #d8d0e4;border-radius:.6rem;font:1rem ui-monospace,monospace}textarea{min-height:10rem}button{margin:.8rem .4rem 0 0;padding:.65rem 1rem;border:0;border-radius:999px;background:#6f3eb0;color:#fff;font-weight:700}.secondary{background:#e7def0;color:#39264d}.result{margin-top:1rem;padding:1rem;background:#eee8f5;border-radius:.7rem;font-family:ui-monospace,monospace}.error{color:#9f2f50}</style></head><body><main><p><a href="../../../../index.html">← The route</a></p><h1>2016 Day 25 · Part 1</h1><p>Search positive seeds until the assembunny output stays in the alternating 0, 1 rhythm.</p><label for="program">Program</label><textarea id="program">cpy 0 b
out b
inc b
out b
jnz 1 -4</textarea><label for="count">Output prefix length</label><input id="count" type="number" min="1" value="8"><button id="run" type="button">Run</button><button id="reset" class="secondary" type="button">Reset</button><div id="result" class="result" aria-live="polite">Enter a program and search its seeds.</div><h2>Concept</h2><p>A clock signal is a local invariant: each new bit must be the opposite of the previous one and must be either zero or one.</p><script>const program=document.querySelector('#program'),count=document.querySelector('#count'),result=document.querySelector('#result'),defaults={program:program.value,count:count.value};function val(x,r){return x in r?r[x]:Number(x)}function signal(text,seed,k){const p=text.split(/\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.split(/\s+/)),r={a:seed,b:0,c:0,d:0},o=[];let i=0;for(let s=0;s<1e6&&i>=0&&i<p.length;s++){const[x,...a]=p[i];if(x==='cpy'&&a.length===2&&a[1]in r)r[a[1]]=val(a[0],r);else if(x==='inc'&&a[0]in r)r[a[0]]++;else if(x==='dec'&&a[0]in r)r[a[0]]--;else if(x==='jnz'&&val(a[0],r)!==0){i+=val(a[1],r);continue}else if(x==='out'){const v=val(a[0],r);if(![0,1].includes(v)||o.at(-1)===v)return o;o.push(v);if(o.length===k)return o}i++}return o}document.querySelector('#run').onclick=()=>{result.className='result';try{const k=Number(count.value);let answer=null;for(let n=1;n<1e4&&!answer;n++)if(signal(program.value,n,k).length===k)answer=n;if(answer===null)throw Error('No seed found in search range.');result.textContent='Lowest seed: '+answer}catch(e){result.className='result error';result.textContent=e.message}};document.querySelector('#reset').onclick=()=>{program.value=defaults.program;count.value=defaults.count;result.className='result';result.textContent='Enter a program and search its seeds.'};</script></main></body></html>
