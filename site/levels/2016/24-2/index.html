<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2016 Day 24 Part 2 | Journey of Advent of Code</title><style>body{margin:0;background:#f7f6fb;color:#292536;font:16px/1.55 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:2rem 1.25rem 4rem}a{color:#6f3eb0}textarea{width:100%;box-sizing:border-box;min-height:10rem;padding:.65rem;border:1px solid #d8d0e4;border-radius:.6rem;font:1rem ui-monospace,monospace}button{margin:.8rem .4rem 0 0;padding:.65rem 1rem;border:0;border-radius:999px;background:#6f3eb0;color:#fff;font-weight:700}.secondary{background:#e7def0;color:#39264d}.result{margin-top:1rem;padding:1rem;background:#eee8f5;border-radius:.7rem;font-family:ui-monospace,monospace}.error{color:#9f2f50}</style></head><body><main><p><a href="../../../../index.html">← The route</a></p><h1>2016 Day 24 · Part 2</h1><p>Find the shortest visit order, then include the final leg back to location 0.</p><label for="map">Duct map</label><textarea id="map">###########
#0.1.....2#
#.#######.#
#4.......3#
###########</textarea><button id="run" type="button">Run</button><button id="reset" class="secondary" type="button">Reset</button><div id="result" class="result" aria-live="polite">Enter a map and find the round trip.</div><h2>Concept</h2><p>The return trip is one extra edge in every candidate cycle. The same measured distances support both parts.</p><script>const map=document.querySelector('#map'),result=document.querySelector('#result'),initial=map.value;function solve(text){const g=text.split(/\n/).filter(Boolean),p={};g.forEach((row,y)=>[...row].forEach((c,x)=>{if(/\d/.test(c))p[c]=[x,y]}));if(!p[0])throw Error('Map has no starting point.');const d={};for(const[s,[sx,sy]]of Object.entries(p)){const q=[[[sx,sy],0]],seen=new Set([sx+','+sy]);d[s]={};while(q.length){const[[x,y],n]=q.shift(),c=g[y][x];if(/\d/.test(c))d[s][c]=n;for(const[nx,ny]of[[x-1,y],[x+1,y],[x,y-1],[x,y+1]])if(g[ny]?.[nx]&&g[ny][nx]!=='#'&&!seen.has(nx+','+ny)){seen.add(nx+','+ny);q.push([[nx,ny],n+1])}}}const t=Object.keys(p).filter(k=>k!=='0'),perm=a=>a.length? a.flatMap((x,i)=>perm(a.slice(0,i).concat(a.slice(i+1))).map(r=>[x,...r])):[[]];return Math.min(...perm(t).map(o=>{const path=['0',...o,'0'];return path.slice(1).reduce((n,x,i)=>n+d[path[i]][x],0)}))}document.querySelector('#run').onclick=()=>{result.className='result';try{result.textContent='Fewest round trip steps: '+solve(map.value)}catch(e){result.className='result error';result.textContent=e.message}};document.querySelector('#reset').onclick=()=>{map.value=initial;result.className='result';result.textContent='Enter a map and find the round trip.'};</script></main></body></html>
